name: Deploy to GH Pages
on: [push]

env:
  NODE_VERSION: "20.x"  # 更新为2026年仍受支持的LTS版本

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4  # 使用稳定版本替代master分支

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'            # 内置缓存依赖项

    - name: Install dependencies
      run: yarn

    - name: Build project
      run: yarn build

    - name: Deploy to GH Pages
      uses: peaceiris/actions-gh-pages@v3  # 更活跃维护的部署方案
      with:
        github_token: ${{ secrets.ACCESS_TOKEN }}
        publish_dir: docs/.vuepress/dist
        # target_branch: gh-pages  # 默认已是gh-pages，可省略
